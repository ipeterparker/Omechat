<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omechat - Next-Generation Anonymous Social Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="logo">
      <h2>Omechat</h2>
    </div>
    <div class="menu-container">
      <button id="menuBtn" class="menu-icon-btn">⋮</button>
      <!-- Dropdown Menu -->
      <div id="menuDropdown" class="menu-dropdown">
        <button id="signInBtn">Sign In with Google</button>
        <button id="themeToggleBtn">Toggle Theme</button>
        <a href="#">Settings</a>
        <a href="#">Help & Support</a>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="hero-section">
      <h1>Welcome to Omechat</h1>
      <p>Connect with people around the globe safely and instantly.</p>
    </div>

    <!-- Video / Chat Container Mockup -->
    <div class="video-chat-container">
      <div class="video-box local-video">
        <span>You</span>
      </div>
      <div class="video-box remote-video">
        <span>Stranger</span>
      </div>
    </div>
  </main>

  <!-- Fixed Bottom Navigation / Call Controls -->
  <div class="call-controls">
    <button class="btn-skip">Skip</button>
    <button class="btn-next">Next</button>
    <button class="btn-exit">Exit</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
